<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/7ee5f2ba27.js" crossorigin="anonymous"></script>
    <link rel="icon" href="assets/images/favicon.png" type="image/x-icon">
</head>
<body>
    <div class="volume">
        <p>Volume:</p>
        <input type="range" id="audio-volume" min="0" max="1" step="0.01">
    </div>
    <div class="start-screen">
        <div class="start-screen-layout">
            <h1>Music Quiz</h1>
            <h2>How much of a <span id="genre-display">House</span> fan are you?</h2>
            <div class="genre-select">
                <button type="button" class="genre-select-btn">House</button>
                <button type="button" class="genre-select-btn">RnB</button>
                <button type="button" class="genre-select-btn">AfroBeat</button>
            </div>
            <button type="button" id="start-quiz-btn">Start Quiz</button>
        </div>
    </div>
    <div class="quiz-screen hidden">

    </div>
    <div class="result-screen hidden">
        <div class="result-screen-layout">
            <h1>You got <span id="right-questions"></span> out of 10!</h1>
            <button type="button" id="go-to-menu-btn">Main Menu</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
